name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Go + packwiz
        run: |
          curl -sL https://go.dev/dl/go1.24.4.linux-amd64.tar.gz | sudo tar -xz -C /usr/local
          export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
          go install github.com/packwiz/packwiz@latest
          echo "/usr/local/go/bin" >> $GITHUB_PATH
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Fetch manual-download jars from CurseForge CDN
        # The 6 mods below have distributionAllowed=false on CurseForge; the API
        # refuses to redistribute them, but direct CDN URLs work. packwiz needs
        # them in its import cache before mr export will succeed.
        run: |
          mkdir -p ~/.cache/packwiz/cache/import
          cd ~/.cache/packwiz/cache/import
          curl -sLo 'fxntstorage-1.3.0+mc-1.21.1-neoforge.jar' \
              'https://edge.forgecdn.net/files/8284/674/fxntstorage-1.3.0+mc-1.21.1-neoforge.jar'
          curl -sLo 'Structory_Towers_26.1_v1.0.16.jar' \
              'https://edge.forgecdn.net/files/7842/394/Structory_Towers_26.1_v1.0.16.jar'
          curl -sLo 'bwncr-neoforge-1.21.1-3.20.4.jar' \
              'https://edge.forgecdn.net/files/8135/209/bwncr-neoforge-1.21.1-3.20.4.jar'
          curl -sLo 'moreoverlays-1.24.2-mc1.21.1-neoforge.jar' \
              'https://edge.forgecdn.net/files/6981/252/moreoverlays-1.24.2-mc1.21.1-neoforge.jar'
          curl -sLo 'imfast-NEOFORGE-1.0.2.jar' \
              'https://edge.forgecdn.net/files/5991/453/imfast-NEOFORGE-1.0.2.jar'
          curl -sLo 'Structory_26.1_v1.3.16.jar' \
              'https://edge.forgecdn.net/files/7850/172/Structory_26.1_v1.3.16.jar'
          ls -la

      - name: Build .mrpack
        run: |
          cd pack
          packwiz mr export -o ../meicloud-all-you-need-${{ github.ref_name }}.mrpack
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: meicloud-all-you-need-*.mrpack
          fail_on_unmatched_files: true
